name: 🌊 Token Harbor Register

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      accounts:
        description: "注册账号数(测试用10)"
        required: false
        default: "10"

permissions:
  contents: write
  actions: write

concurrency:
  group: TokenHarborRegister
  cancel-in-progress: false

env:
  PRIVATE_REPO: pingmike2/tokenharbor2api
  PROJECT_DIR: tokenharbor2api

jobs:
  register:
    name: 注册+取key (批次 ${{ matrix.batch }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # 并行批次: 每批独立 runner/WARP, 每批最多3个号(避开单runner 3 IP 池限制)
        # 默认4批=10个号(3+3+3+1), 测试可传 accounts=1 只跑第1批
        batch: [1, 2, 3, 4]

    steps:
      - name: 计算本批账号数
        id: calc
        run: |
          TOTAL=${{ inputs.accounts || '10' }}
          BATCH=${{ matrix.batch }}
          # 每批上限3个号
          PER=3
          START=$(( (BATCH - 1) * PER + 1 ))
          END=$(( BATCH * PER ))
          [ $END -gt $TOTAL ] && END=$TOTAL
          COUNT=$(( END - START + 1 ))
          [ $COUNT -lt 1 ] && COUNT=0
          echo "total=$TOTAL batch=$BATCH start=$START end=$END count=$COUNT"
          echo "TH_COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "BATCH=$BATCH" >> "$GITHUB_ENV"
      - name: 检出 My-Auto
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 检出私库 tokenharbor2api
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 0

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip wget ca-certificates \
            fonts-liberation libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libc6 libcairo2 libcups2t64 libdbus-1-3 libexpat1 libfontconfig1 \
            libgbm1 libgcc-s1 libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 \
            libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 \
            libxi6 libxrandr2 libxrender1 libxss1 libxtst6 xdg-utils

      - name: 安装 Google Chrome
        run: |
          wget -q -O /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i /tmp/google-chrome.deb || sudo apt-get install -fy

      - name: 安装 Python 依赖
        run: pip install DrissionPage==4.1.0.18 requests

      - name: 启用 WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          stack: dual
          mode: client

      - name: 修复 DNS
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo systemctl disable systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo -e "nameserver 1.1.1.1\nnameserver 8.8.8.8" | sudo tee /etc/resolv.conf

      - name: 执行注册
        if: env.TH_COUNT > '0'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          Xvfb :99 -screen 0 1280x900x24 &
          sleep 2
          export DISPLAY=:99
          python register.py
        env:
          PYTHONUNBUFFERED: 1
          TH_ACCOUNTS: ${{ env.TH_COUNT }}

      - name: 失败时上传截图
        # 成功不上传(截图含 apikey 防泄露), 仅失败才上传供排障
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ env.PROJECT_DIR }}/output/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传本批次 key/accounts (供 merge job 合并)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-${{ env.BATCH }}
          path: |
            ${{ env.PROJECT_DIR }}/apikey.txt
            ${{ env.PROJECT_DIR }}/accounts.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

  merge:
    name: 合并批次key回私库
    needs: register
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出私库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: 拉取所有批次产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 合并 apikey + accounts 并推送
        run: |
          # 各批次产物在 artifacts/ 下: batch-1/..., batch-2/...
          for f in apikey.txt accounts.txt; do
            touch "$f"
            find artifacts -name "$f" -type f -exec cat {} + | grep -v '^$' | sort -u -o "$f" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apikey.txt accounts.txt
          git diff --cached --quiet && { echo "无变化"; exit 0; }
          git commit -m "chore: merge keys/accounts $(date +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin HEAD:main
          echo "✅ apikey 共 $(wc -l < apikey.txt) 个 (内容隐藏)"
          echo "✅ accounts 共 $(wc -l < accounts.txt) 个 (内容隐藏)"
