name: 🪙 Z.AI deviceToken 采集 + D1 灌池

on:
  schedule:
    # 每 2 小时: 只采集 + 灌 D1 (定时触发无 inputs.deploy → 自动跳过部署)
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 采集 deviceToken 数量 (每 token 用一次)
        required: false
        default: "750"
      deploy:
        description: 是否同时部署 Worker (代码有更新时才需要)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 拉取私库 zai2api (workflow 引用 worker.js + collect-tokens.mjs)
      - name: 拉取私库 zai2api
        uses: actions/checkout@v4
        with:
          repository: pingmike2/zai2api
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: zai2api
          ref: main

      - name: 安装依赖 + Chromium
        working-directory: zai2api
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: 配置 wrangler 凭证
        working-directory: zai2api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "❌ 缺 secrets.CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "❌ 缺 secrets.CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: 采集 deviceToken
        working-directory: zai2api
        run: |
          node collect-tokens.mjs --count ${{ inputs.count || '750' }} --out tokens.sql

      # D1 数据库与表结构已固定在私库 (wrangler.toml + 建表语句); 这里只导入 token
      - name: token 池灌进 D1
        working-directory: zai2api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ ! -s tokens.sql ]; then echo "❌ tokens.sql 为空"; exit 1; fi
          echo "待导入 INSERT 条数: $(grep -c '^INSERT' tokens.sql)"
          npx wrangler d1 execute zai-tokens --remote --file tokens.sql
          echo "✅ D1 灌池完成"

      # D1 已固定写死在私库 wrangler.toml; 仅手动触发勾选 deploy 时重新部署
      - name: 部署 Worker
        if: ${{ inputs.deploy }}
        working-directory: zai2api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZAI_AUTH_KEY: ${{ secrets.ZAI_AUTH_KEY }}
        run: |
          # 注入客户端访问鉴权 key 到 wrangler.toml [vars]
          if [ -n "$ZAI_AUTH_KEY" ]; then
            sed -i "s|# ZAI_AUTH_KEY = \"your-client-key\"|ZAI_AUTH_KEY = \"$ZAI_AUTH_KEY\"|" wrangler.toml
            echo "✅ ZAI_AUTH_KEY 已注入 wrangler.toml"
          fi
          npx wrangler deploy
